# Domain-free secure UGN dashboard. A VPS with Tailscale installed is required.
# The only host port binding is the loopback interface; no public web port is exposed.
name: ugn-public
services:
  dashboard:
    build:
      context: ../..
      dockerfile: deploy/website/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /app/data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a unique admin password in private .env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set your assigned Tailscale HTTPS URL in private .env}
    volumes:
      - ugn_private:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode===401?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
volumes:
  ugn_private:
